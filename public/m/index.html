<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover 必须声明：否则 iOS 的 env(safe-area-inset-*) 恒为 0，底部标签栏会被 Home Indicator 压住 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fa" />
  <!-- 资产编号 / SN 全是长数字，iOS 会自作主张把它们变成蓝色可点电话链接，必须关掉 -->
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>IT 资产录入</title>
  <link rel="stylesheet" href="/assets/m.css" />
</head>
<body>
  <div id="app">
    <header class="m-head">
      <div class="m-brand">
        <span class="em"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M2 20.5h20"/></svg></span>
        <span class="m-brand-txt">资产录入</span>
      </div>
      <!-- 管理端有「打开移动端录入」，这里也要能回管理端，否则只能手敲网址 -->
      <div class="m-head-act">
        <a class="m-icon-btn" href="/" title="返回电脑端管理后台" aria-label="返回电脑端管理后台">
          <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="13" rx="2"/><path d="M8 20.5h8M12 16.5v4"/></svg>
        </a>
        <label class="m-operator">
          <span class="em"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.8"/><path d="M4.5 20.5v-1.6a4.6 4.6 0 0 1 4.6-4.6h5.8a4.6 4.6 0 0 1 4.6 4.6v1.6"/></svg></span>
          <input id="operator" placeholder="录入人" autocomplete="off" spellcheck="false" aria-label="录入人姓名" />
        </label>
      </div>
    </header>

    <main class="m-main" id="main"></main>

    <nav class="m-tabbar" id="tabbar" role="tablist" aria-label="主导航">
      <button class="tab active" data-v="home" role="tab" aria-selected="true"><span class="em"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.6A2.6 2.6 0 0 1 5.6 6h1.6l1.2-2h7.2l1.2 2h1.6A2.6 2.6 0 0 1 21 8.6v7.8A2.6 2.6 0 0 1 18.4 19H5.6A2.6 2.6 0 0 1 3 16.4z"/><circle cx="12" cy="12.4" r="3.4"/></svg></span><span>识别入库</span></button>
      <button class="tab" data-v="scan" role="tab" aria-selected="false"><span class="em"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></span><span>扫码核对</span></button>
      <button class="tab" data-v="recent" role="tab" aria-selected="false"><span class="em"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.6A2.6 2.6 0 0 1 5.6 5h2.9a2 2 0 0 1 1.6.8l1 1.4a2 2 0 0 0 1.6.8h5.7A2.6 2.6 0 0 1 21 10.6v6A2.6 2.6 0 0 1 18.4 19H5.6A2.6 2.6 0 0 1 3 16.4z"/></svg></span><span>最近设备</span></button>
    </nav>
  </div>

  <!-- 相机遮罩 -->
  <div id="cameraOverlay" class="cam-overlay" hidden>
    <video id="cameraVideo" playsinline autoplay muted></video>
    <div class="cam-frame" id="camFrame"></div>
    <div class="cam-guide" id="camGuide">拍照识别</div>
    <div class="cam-top">
      <button class="cam-close" onclick="closeCamera()" aria-label="关闭相机"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
      <span class="cam-hint" id="camHint">对准铭牌上的 SN 条码 / 文字</span>
    </div>
    <div class="cam-bottom">
      <button class="cam-gallery" onclick="pickFromGallery()" aria-label="从相册选图"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.4"/><circle cx="8.8" cy="9.5" r="1.7"/><path d="m3.6 17.2 4.7-4.6a2 2 0 0 1 2.8 0l5.1 5"/><path d="m14.5 14.5 1.7-1.7a2 2 0 0 1 2.8 0l1.4 1.4"/></svg></button>
      <button class="cam-shutter" id="shutter" onclick="capture()" aria-label="拍照"></button>
      <button class="cam-flip" onclick="flipCamera()" aria-label="切换前后摄像头"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5A8.5 8.5 0 0 0 6.1 6.3L3.5 8.6"/><path d="M3.5 4v4.6H8"/><path d="M3.5 12.5A8.5 8.5 0 0 0 17.9 17.7l2.6-2.3"/><path d="M20.5 20v-4.6H16"/></svg></button>
    </div>
  </div>

  <!-- 拍照结果预览 -->
  <div id="previewOverlay" class="preview-overlay" hidden>
    <img id="previewImg" alt="识别图片" />
    <div class="preview-info" id="previewInfo" hidden></div>
    <div class="preview-actions">
      <button class="pbtn" onclick="retakePhoto()">重拍</button>
      <button class="pbtn" onclick="savePreviewShot()"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 15.5V19a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 19v-3.5"/><path d="m7.5 11 4.5 4.5 4.5-4.5"/><path d="M12 15.5V3"/></svg> 保存</button>
      <button class="pbtn primary" id="btnRecognize" onclick="startRecognize()"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg> 识别</button>
    </div>
  </div>

  <!-- 铭牌照片放大比对（从「识别结果」页点缩略图进入） -->
  <div id="shotViewer" class="shot-viewer" hidden>
    <div class="sv-top">
      <span id="shotViewerInfo">铭牌照片 · 双指缩放 / 拖动查看</span>
      <button class="cam-close" onclick="closeShotViewer()" aria-label="关闭"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
    <div class="sv-stage" id="shotStage">
      <img id="shotViewerImg" alt="铭牌照片" />
    </div>
    <div class="sv-bottom">
      <button class="pbtn" onclick="shotZoom(-0.5)" aria-label="缩小"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button>
      <button class="pbtn" onclick="shotZoom(0.5)" aria-label="放大"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="pbtn" onclick="saveViewerShot()"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 15.5V19a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 19v-3.5"/><path d="m7.5 11 4.5 4.5 4.5-4.5"/><path d="M12 15.5V3"/></svg> 存手机</button>
      <button class="pbtn primary" onclick="closeShotViewer()">比完了</button>
    </div>
  </div>

  <div class="m-toasts" id="mToasts" role="status" aria-live="polite"></div>
  <script type="module" src="/assets/m.js"></script>
</body>
</html>
